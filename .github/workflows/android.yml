name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The 2020-era Android Gradle Plugin cannot parse the package.xml format of
      # newer SDK platforms/build-tools preinstalled on the runner, so remove them
      # and install exactly what this project needs (SDK 29, build-tools 29.0.2).
      # This step uses the runner's default JDK 17, which the modern sdkmanager needs.
      - name: Prepare SDK for legacy AGP
        run: |
          rm -rf "$ANDROID_HOME/platforms"/android-3*
          rm -rf "$ANDROID_HOME/build-tools"/3*
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29" "build-tools;29.0.2" > /dev/null
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
